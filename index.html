<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap to Earn TMA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { bgMain: '#1A1A2E', accentGold: '#FFD700', accentNeon: '#00F0FF' }
                }
            }
        }
    </script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Add this Supabase SDK line exactly like this: -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Monetag SDK (Placeholder URL, replace with actual zone script) -->
    <script src='//libtl.com/sdk.js' data-zone='12184150' data-sdk='show_12184150'></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; }
        .coin { transition: transform 0.05s ease; box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); }
        .coin:active { transform: scale(0.95); }
        .tab-active { border-bottom: 2px solid #FFD700; color: #FFD700; }
    </style>
</head>
<body class="bg-bgMain text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="p-4 flex justify-between items-center bg-white/5 border-b border-white/10">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-accentNeon flex items-center justify-center font-bold text-black" id="avatar">?</div>
            <span id="usernameDisplay" class="font-semibold text-lg text-gray-200">Loading...</span>
        </div>
        <div class="text-right">
            <div class="text-sm text-gray-400">Balance</div>
            <div class="text-xl font-bold text-accentGold" id="balance">0</div>
        </div>
    </header>

    <!-- Main Game View -->
    <main id="gameView" class="flex-1 flex flex-col items-center justify-center p-6 relative">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-wider text-accentNeon drop-shadow-md">TAP & EARN</h1>
        </div>

        <button id="tapButton" class="coin w-48 h-48 rounded-full bg-gradient-to-br from-yellow-400 to-yellow-600 flex items-center justify-center relative overflow-hidden focus:outline-none">
            <span class="text-5xl font-black text-white drop-shadow-lg">T</span>
        </button>

        <div class="w-full max-w-xs mt-12">
            <div class="flex justify-between text-sm mb-1">
                <span class="text-gray-300">Energy</span>
                <span class="font-bold text-accentNeon" id="energyText">1000 / 1000</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-4">
                <div id="energyBar" class="bg-accentNeon h-4 rounded-full" style="width: 100%"></div>
            </div>
        </div>

        <button id="rechargeBtn" class="mt-6 hidden w-full max-w-xs py-3 rounded-xl bg-gradient-to-r from-purple-600 to-blue-600 font-bold text-white shadow-lg animate-pulse">
            ⚡ Watch Ad to Recharge (100% + Bonus)
        </button>
    </main>

    <!-- Referral / Friends View (Hidden by default) -->
    <main id="friendsView" class="flex-1 hidden flex-col p-6 overflow-y-auto">
        <h2 class="text-2xl font-bold mb-4 text-accentGold">Invite Friends</h2>
        <p class="text-gray-400 text-sm mb-6">Invite 3 friends to unlock perpetual 2x tap multiplier and withdrawal access.</p>
        
        <div class="bg-white/5 rounded-xl p-4 mb-6 border border-white/10">
            <div class="flex justify-between items-center mb-2">
                <span class="text-gray-300">Milestone Progress</span>
                <span class="text-accentNeon font-bold" id="referralCount">0 / 3</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2">
                <div id="referralBar" class="bg-accentGold h-2 rounded-full" style="width: 0%"></div>
            </div>
        </div>

        <button id="inviteBtn" class="w-full py-3 rounded-xl bg-accentGold text-black font-bold text-lg shadow-[0_0_15px_rgba(255,215,0,0.3)]">
            Share Invite Link
        </button>
    </main>

    <!-- Leaderboard View (Hidden by default) -->
    <main id="leaderboardView" class="flex-1 hidden flex-col p-6 overflow-y-auto">
        <h2 class="text-2xl font-bold mb-4 text-accentGold text-center">Top 50 Players</h2>
        <div id="leaderboardList" class="flex flex-col gap-3 pb-20">
            <div class="text-center text-gray-400 mt-10 animate-pulse">Loading ranks...</div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="flex bg-white/5 border-t border-white/10 pb-safe">
        <button id="navGame" class="flex-1 py-4 tab-active font-semibold">Game</button>
        <button id="navFriends" class="flex-1 py-4 text-gray-400 font-semibold">Friends</button>
        <button id="navLeaderboard" class="flex-1 py-4 text-gray-400 font-semibold">Rank</button>
    </nav>

    <script src="app.js?v=2"></script>
</body>
</html>
